[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard"
version = "0.1.0"
description = "Auto-claims fraud investigation platform (synthetic and public data only)"
requires-python = ">=3.11"
dependencies = [
    "faker>=30",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["data*", "ml*", "agents*", "services*", "evals*"]